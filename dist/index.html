<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FishBot 智能巡检平台</title>
<style>
:root{--bg:#f3f6f5;--ink:#183a38;--muted:#748985;--green:#1c695b;--line:#e1ebe7;--lime:#d8ee8c;--amber:#edb36e;--shadow:0 8px 30px rgba(29,64,53,.045)}*{box-sizing:border-box}body{margin:0;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #a1d7c7;outline-offset:2px}.shell{min-height:100vh;display:flex}.side{position:fixed;inset:0 auto 0 0;width:220px;background:#143e38;color:#e7f4eb;display:flex;flex-direction:column;padding:28px 16px}.brand{font-weight:800;font-size:19px;letter-spacing:-.4px;padding:0 9px}.brand small{display:block;color:#a5c5b5;font-size:9px;letter-spacing:2px;margin-top:3px}.nav{display:grid;gap:7px;margin-top:51px}.nav button{color:#b9d3c8;border:0;background:transparent;border-radius:9px;text-align:left;padding:12px}.nav button.active,.nav button:hover{background:#2b5b51;color:white}.nav i{font-style:normal;display:inline-block;width:27px;font-size:16px}.sidefoot{margin:auto 9px 0;border-top:1px solid #467069;padding-top:16px;font-size:11px;color:#a8c8b9}.main{margin-left:220px;width:calc(100% - 220px);padding:27px 4% 50px;max-width:1720px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}.eyebrow{font-size:10px;letter-spacing:2px;color:#839b91;font-weight:700}.top-title{font-weight:700;margin-top:3px}.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.chip{border:1px solid #d7e5df;background:#fff;border-radius:50px;padding:6px 11px;font-size:11px;color:#678079}.chip b{display:inline-block;width:7px;height:7px;background:#aabbb2;border-radius:50%;margin-right:6px}.chip.online b{background:#51a77b}.btn{border:1px solid #d8e6df;border-radius:8px;background:#fff;color:#47685e;padding:8px 12px}.btn.primary{color:white;background:#1c695b;border-color:#1c695b}.btn:disabled{opacity:.6;cursor:default}.hero{background:#deeee6;border:1px solid #d0e4d8;border-radius:16px;margin-top:25px;padding:26px 29px;display:flex;justify-content:space-between;align-items:center;gap:20px}.hero h1{font-size:29px;letter-spacing:-1px;line-height:1.2;margin:7px 0}.hero p{color:#54766a;max-width:720px}.hero-mark{font-size:10px;font-weight:800;letter-spacing:2px;line-height:1.7;color:#52816e}.notice{border:1px solid #f1e3c9;background:#fff8ec;color:#836445;padding:12px 15px;border-radius:9px;margin-top:17px;font-size:12px}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:27px 0 12px}.head h2{font-size:18px;margin:0}.head p,.muted{color:var(--muted);margin:3px 0 0;font-size:12px}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:15px}.two{grid-template-columns:1.2fr 1fr}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:19px;box-shadow:var(--shadow);min-width:0}.metric-title{font-size:12px;color:#738d82}.metric{font-size:26px;font-weight:700;margin:11px 0 2px;line-height:1.2;overflow-wrap:anywhere}.metric small{font-size:13px;font-weight:500;color:#789188}.metric-note{font-size:11px;color:#93a8a0}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.card-head h3{font-size:15px;margin:0}.tag{font-size:11px;border-radius:20px;background:#edf4f0;color:#688078;padding:4px 9px;white-space:nowrap}.tag.green{background:#e2f5e8;color:#32845a}.tag.amber{background:#fff2df;color:#aa7135}.visual{height:210px;border-radius:10px;background:#173c37;color:#c3dcd0;display:grid;place-items:center;text-align:center;padding:20px}.visual .icon{font-size:29px;color:#a6d4bf}.visual p{color:#96b8a9;font-size:12px;margin:6px 0}.camera-caption{font-size:12px;color:#8b9d95;margin:11px 0 0}.rows .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid #edf2ef}.rows .row:last-child{border-bottom:0}.rows .row span{color:#789087}.row strong{text-align:right;overflow-wrap:anywhere}.empty{color:#93a79e;padding:25px 4px;font-size:12px}.event-list .event{padding:12px 0;border-bottom:1px solid #edf2ef}.event:last-child{border:0}.event strong{display:block}.event small{display:block;color:#93a69d;margin-top:3px}.event pre{font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;color:#668076;margin:8px 0 0}.flow{background:#f4f8f5;border-radius:10px;color:#4a7566;padding:16px;line-height:1.9}.field{display:grid;gap:6px;margin:16px 0}.field label{font-size:12px;color:#71887c}.field input{width:100%;border:1px solid #d7e6de;border-radius:8px;padding:10px;color:#264c3e;background:white}.help{font-size:12px;color:#8b9f96}.details{margin-top:12px;color:#789087;font-size:12px}.footer{margin-top:36px;padding-top:16px;border-top:1px solid #dfeae4;color:#9aaca3;font-size:11px}.code{font-family:ui-monospace,monospace;overflow-wrap:anywhere}.inline{display:flex;gap:8px;flex-wrap:wrap}.link{color:#257965;text-decoration:none}.link:hover{text-decoration:underline}pre{max-width:100%} @media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:700px){.shell{display:block}.side{position:static;width:100%;padding:16px}.brand small{display:none}.nav{display:flex;overflow:auto;margin-top:14px;gap:5px}.nav button{flex:none;padding:8px 10px;font-size:12px}.nav i{width:auto;margin-right:5px}.sidefoot{display:none}.main{width:100%;margin:0;padding:20px 14px 40px}.top{align-items:flex-start}.top-right{justify-content:flex-end}.hero{padding:21px;margin-top:18px}.hero h1{font-size:25px}.hero-mark{display:none}}@media(max-width:390px){.stats{grid-template-columns:1fr}.top-right .chip{display:none}}
</style>
</head><body><div class="shell"><aside class="side"><div class="brand">◈ FishBot 巡检<small>MOBILE INSPECTION SYSTEM</small></div><nav class="nav" aria-label="主导航"><button data-page="dashboard" class="active"><i>◉</i>巡检总览</button><button data-page="records"><i>▤</i>数据与事件</button><button data-page="connection"><i>⌁</i>连接设置</button></nav><div class="sidefoot">FISHBOT / IOT PROJECT<br>移动感知 · 状态可视 · 事件留痕</div></aside><main class="main"><header class="top"><div><div class="eyebrow">FISHBOT / INSPECTION PLATFORM</div><div class="top-title">移动式智能巡检与预警平台</div></div><div class="top-right"><span class="chip" id="backendChip"><b></b>后端未连接</span><button class="btn" id="refresh">↻ 刷新</button></div></header><div id="app"></div><footer class="footer">FISHBOT INSPECTION / 状态来自后端实际数据 · 连接状态不代表设备工作正常</footer></main></div>
<script>
const SITE_PREFIX=location.pathname.startsWith('/fishbot/')?'/fishbot':'';const API_KEY='fishbot-api-base';const OLD_KEY='fishbot-project-v1';const app=document.querySelector('#app');let page='dashboard',snapshot=null,rows=[],error='',busy=false;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const time=t=>t?new Date(Number(t)*1000).toLocaleString('zh-CN',{hour12:false}):'暂无';
const val=(data,key,suffix='')=>data&&Object.hasOwn(data,key)&&data[key]!==null?esc(data[key])+suffix:'--';
const label=key=>({'device_id':'设备标识','temperature_c':'温度 (°C)','mq7_raw':'MQ-7 原始值','mq135_raw':'MQ-135 原始值','event':'事件','alarm':'告警','message':'消息','status':'状态','data_source':'数据来源','threshold_alert':'阈值提醒'})[key]||key;
function sourceLabel(r){return r?.payload?.data_source==='simulation'?'模拟消息':r?.payload?.data_source==='unverified_device'?'设备消息（来源未核实）':'来源未知'}
function latest(){return rows.length?rows[0]:null}
function metric(title,value,note){return `<div class="card"><div class="metric-title">${title}</div><div class="metric">${value}</div><div class="metric-note">${note}</div></div>`}
function header(title,sub,right=''){return `<div class="head"><div><h2>${title}</h2><p>${sub}</p></div>${right}</div>`}
function rawRows(data){if(!data||!Object.keys(data).length)return '<div class="empty">尚未收到设备数据。</div>';return `<div class="rows">${Object.entries(data).map(([k,v])=>`<div class="row"><span>${esc(label(k))}</span><strong>${esc(v===null?'空':String(v))}</strong></div>`).join('')}</div>`}
function events(){return rows.filter(r=>r.payload&&['event','alarm','threshold_alert'].some(k=>Object.hasOwn(r.payload,k)&&r.payload[k]!==null&&r.payload[k]!==false&&r.payload[k]!==''&&r.payload[k]!==0));}
function eventList(items){if(!items.length)return '<div class="empty">暂无设备上报的事件。系统不会自行生成报警。</div>';return `<div class="event-list">${items.map(r=>`<div class="event"><strong>${esc(String(r.payload.event??r.payload.alarm??r.payload.threshold_alert))}</strong><small>${esc(time(r.received_at))} · ${esc(r.payload.device_id??'未指定设备')} · ${sourceLabel(r)}</small><pre>${esc(JSON.stringify(r.payload,null,2))}</pre></div>`).join('')}</div>`}
function dashboard(){let item=latest(),d=item?.payload||{},mqtt=snapshot?.mqtt_connected;return `<div class="hero"><div><div class="eyebrow">MOBILE INSPECTION / 01</div><h1>让巡检数据，清晰可见。</h1><p>以 FishBot 移动巡检为载体，汇集传感数据、设备状态和事件记录，支撑现场展示与后续联调。</p></div><div class="hero-mark">SENSE<br>CONNECT<br>RESPOND</div></div>${!snapshot?'<div class="notice">当前未连接后端，页面没有显示模拟数据。请先在「连接设置」中配置已运行的后端。</div>':''}<div class="grid stats">${metric('MQTT Broker',snapshot?(mqtt?'已连接':snapshot.mqtt_configured?'未连接':'未配置'):'--','这是网关报告的 Broker 连接状态')}${metric('设备状态',!item?'未知':item.payload?.data_source==='simulation'?'模拟数据':(Date.now()/1000-item.received_at>60?'通信超时':item.payload?.status==='online'?'上报在线':'状态未知'),'依据上报与接收时间，非设备健康证明')}${metric('最近数据接收',item?esc(time(item.received_at)):'--','服务器接收时间；不代表设备在线')}${metric('温度',val(d,'temperature_c',' <small>°C</small>'),'仅显示设备上报的 temperature_c')}${metric('气体原始数据',val(d,'mq7_raw'),'MQ-7 原始值；不是气体浓度')}</div>${header('现场巡检','先让一条真实数据跑通，再逐步接入视觉与 FishBot 状态')}<div class="grid two"><div class="card"><div class="card-head"><h3>视觉画面</h3><span class="tag">待接入</span></div><div class="visual"><div><div class="icon">▣</div><strong>摄像头画面尚未接入</strong><p>待确认 OV2640 的实际连接和图像传输方案</p></div></div><p class="camera-caption">当前页面不提供实时视频或图像识别结果。</p></div><div class="card"><div class="card-head"><h3>最新设备数据</h3><span class="tag ${item?'green':''}">${item?'已收到':'等待数据'}</span></div>${rawRows(d)}<p class="details">${item?'来源：'+sourceLabel(item)+' · 主题：'+esc(item.topic)+' · 接收：'+esc(time(item.received_at)):'启动 MQTT 设备并向约定主题发送消息后显示。'}</p></div></div>${header('最近上报事件','展示设备事件及显式配置阈值触发的提醒',`<button class="btn" data-goto="records">查看数据 →</button>`)}<div class="card">${eventList(events().slice(0,3))}</div>`}
function records(){return `<div class="hero"><div><div class="eyebrow">RECORDS / 02</div><h1>数据与事件</h1><p>查看后端收到的 MQTT 数据；事件内容由设备或后续处理程序提供。</p></div><div class="hero-mark">RECEIVE<br>RECORD<br>REVIEW</div></div>${!snapshot?'<div class="notice">后端未连接，无法读取记录。请检查「连接设置」。</div>':''}${header('事件记录','以下展示最近 30 条数据中的上报事件和已配置阈值提醒')}<div class="card">${eventList(events())}</div>${header('最近数据','最多显示后端最近 30 条记录；时间由服务器记录')}<div class="card">${rows.length?`<div class="event-list">${rows.map(r=>`<div class="event"><strong>${esc(r.payload?.device_id??'未指定设备')}</strong><small>${esc(time(r.received_at))} · ${esc(r.topic)} · ${sourceLabel(r)}</small><pre>${esc(JSON.stringify(r.payload,null,2))}</pre></div>`).join('')}</div>`:'<div class="empty">暂时没有可展示的设备记录。</div>'}</div><div class="notice">展示上报事件及已配置的阈值提醒；尚未实现报警确认或远程控制。MQ-7 / MQ-135 的原始值不能直接视为气体浓度。</div>`}
function connection(){let base=localStorage.getItem(API_KEY)||'';return `<div class="hero"><div><div class="eyebrow">CONNECTION / 03</div><h1>连接设置</h1><p>配置网页访问的后端，查看通信链路是否建立。</p></div><div class="hero-mark">DEVICE<br>MQTT<br>WEB</div></div>${header('系统连接','Broker 与后端需分别运行')}<div class="grid two"><div class="card"><div class="card-head"><h3>后端地址</h3><span class="tag ${snapshot?'green':'amber'}">${snapshot?'已连接':'未连接'}</span></div><p class="help">前后端部署在同一域名时留空；分开部署时填入完整后端地址。</p><div class="field"><label for="apiBase">后端地址（不要填写账号或密码）</label><input id="apiBase" value="${esc(base)}" placeholder="留空使用当前站点"></div><div class="inline"><button class="btn primary" id="saveApi">保存并连接</button><button class="btn" id="testApi">重新检查</button></div><p class="details" id="addressHint">${esc(error||'HTTPS 网页需要 HTTPS 后端，跨域访问需要在后端配置允许的来源。')}</p></div><div class="card"><div class="card-head"><h3>通信状态</h3></div><div class="rows"><div class="row"><span>后端 API</span><strong>${snapshot?'已连接':'未连接'}</strong></div><div class="row"><span>MQTT Broker</span><strong>${snapshot?(snapshot.mqtt_connected?'已连接':snapshot.mqtt_configured?'未连接':'未配置'):'未知'}</strong></div><div class="row"><span>出站网关</span><strong>${snapshot?.gateway_online?'在线':'未连接或超时'}</strong></div><div class="row"><span>订阅主题</span><strong class="code">${esc(snapshot?.topic??'未知')}</strong></div><div class="row"><span>最近收到</span><strong>${esc(time(snapshot?.last_message_at))}</strong></div></div><p class="details">${esc(snapshot?.last_error||'网关通过 HTTPS 出站转发局域网 MQTT；连接 Broker 不代表小车或传感器在线。')}</p></div></div>${header('数据如何到达网页','已提供只读 ROS 2 桥与局域网出站网关，真实设备尚待联调')}<div class="card"><div class="flow">传感器 → ESP32-S3 → MQTT Broker → Python 后端 / 数据库 → 巡检网页<br>FishBot ROS 2 → 只读桥（需配置实际话题）→ MQTT Broker → 出站 HTTPS 网关<br>摄像头 → 传输 / 识别方案待确定</div><p class="details">建议先用一个已接好的传感器完成真实数据闭环，再接入小车状态和摄像头。服务端、主题及字段请根据实际设备统一配置。</p><div class="inline"><a class="btn" href="${SITE_PREFIX}/fishbot-server-kit.zip" download style="text-decoration:none">↓ 下载服务器源码包</a><button class="btn" id="exportOld">导出旧项目记录</button></div><p class="details">旧任务和硬件记录仍留在原浏览器，可用上方按钮备份。站点通过 HTTPS 和访问账号保护；BIOT 仅限可信局域网，真实硬件尚待验证。</p></div>`}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));app.innerHTML=page==='dashboard'?dashboard():page==='records'?records():connection();app.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>navigate(b.dataset.goto));if(page==='connection'){document.querySelector('#saveApi').onclick=()=>{let v=document.querySelector('#apiBase').value.trim().replace(/\/$/,'');try{if(v){let u=new URL(v);if(!['https:','http:'].includes(u.protocol)||u.username||u.password||u.search||u.hash||(location.protocol==='https:'&&u.protocol!=='https:'))throw Error()}localStorage.setItem(API_KEY,v);snapshot=null;rows=[];error='';refresh()}catch{document.querySelector('#addressHint').textContent='地址无效：请输入 HTTP(S) 地址，HTTPS 页面需要 HTTPS 后端。'}};document.querySelector('#testApi').onclick=refresh;document.querySelector('#exportOld').onclick=()=>{let old=localStorage.getItem(OLD_KEY);if(!old){document.querySelector('#addressHint').textContent='当前浏览器没有找到旧项目记录。';return}let a=document.createElement('a');let url=URL.createObjectURL(new Blob([old],{type:'application/json'}));a.href=url;a.download='fishbot-project-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}}
function navigate(p){page=p;render();window.scrollTo(0,0)}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));document.querySelector('#refresh').onclick=refresh;
async function refresh(){if(busy)return;busy=true;let base=localStorage.getItem(API_KEY)||SITE_PREFIX;try{let replies=await Promise.all([fetch(base+'/api/status',{signal:AbortSignal.timeout(5000),cache:'no-store'}),fetch(base+'/api/readings',{signal:AbortSignal.timeout(5000),cache:'no-store'})]);if(replies.some(r=>!r.ok))throw Error('API 请求失败');let [s,r]=await Promise.all(replies.map(x=>x.json()));if(s?.backend!=='online'||!Array.isArray(r))throw Error('API 数据格式不正确');snapshot=s;rows=r.filter(x=>x&&x.payload&&typeof x.payload==='object'&&!Array.isArray(x.payload));error=''}catch(e){snapshot=null;rows=[];error='后端未连接：请检查地址、后端服务、HTTPS 和跨域设置。'}finally{busy=false;let chip=document.querySelector('#backendChip');chip.classList.toggle('online',!!snapshot);chip.innerHTML='<b></b>'+(snapshot?'后端已连接':'后端未连接');if(!(page==='connection'&&document.activeElement?.id==='apiBase'))render()}}
render();refresh();setInterval(refresh,5000);
</script></body></html>
