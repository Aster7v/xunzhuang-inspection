name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile backend/server.py gateway/biot_gateway.py gateway/ros2_mqtt_bridge.py
      - name: Run backend tests
        run: python -m unittest discover -s tests
      - name: Check frontend JavaScript syntax
        run: |
          python -c "from pathlib import Path; import re; s=Path('dist/index.html').read_text(encoding='utf-8'); Path('/tmp/fishbot-frontend.js').write_text(re.search(r'<script>(.*?)</script>', s, re.S).group(1), encoding='utf-8')"
          node --check /tmp/fishbot-frontend.js
